[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokee-sdk"
version = "0.1.0"
description = "Unofficial experimental Python client patterns for a Pokee-style task API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Nino Amor" },
]
keywords = ["pokee", "ai", "sdk", "automation", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/Niraven/pokee-sdk-python"
Repository = "https://github.com/Niraven/pokee-sdk-python"
Issues = "https://github.com/Niraven/pokee-sdk-python/issues"
Changelog = "https://github.com/Niraven/pokee-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pokee_sdk"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
